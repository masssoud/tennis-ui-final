name: UI CI/CD

on:
  push:
    branches: [v1-agent]
  pull_request:
    branches: [v1-agent]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build production Docker image
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: docker build --build-arg VITE_API_BASE_URL="$API_BASE_URL" --tag tennis-ui:${{ github.sha }} .

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ParsPack deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PARSPACK_UI_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
