name: UI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build production Docker image
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: docker build --build-arg VITE_API_BASE_URL="$API_BASE_URL" --tag tennis-ui:${{ github.sha }} .
